name: Generate Books 2026

on:
  schedule:
    - cron: '0 */12 * * *' # Her 12 saatte bir çalışır (Güvenli ve Sonsuz Döngü)
  workflow_dispatch: # GitHub üzerinden manuel tetiklemeye izin verir

concurrency:
  group: "book-writer-bot-2026"
  cancel-in-progress: false # Yeni gelen botu kapıda sırada beklet.

permissions:
  contents: write # Push yetkisi için gerekli

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Eğer node_modules yoksa, boş bir npm projesi başlatmasını önlemek için
        run: npm install

      - name: Run Book Writer Bot
        run: node scripts/github-book-writer2026.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          PENGUIN_API_KEY: ${{ secrets.PENGUIN_API_KEY }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]-2026'
          git config --global user.email 'github-actions[bot]-2026@users.noreply.github.com'
          git add generated2026-* book_history2026.json
          
          # Değişiklik olup olmadığını kontrol et
          if git diff --staged --quiet; then
            echo "Herhangi bir degisiklik veya yeni kitap uretilmedi."
          else
            # Kısa Hash (7 karakter) formatına uygun bir mesajla commit yap
            SHORT_HASH=$(git rev-parse --short HEAD)
            git commit -m "feat: Auto-generated daily books 2026 (Ref: $SHORT_HASH)"
            
            # Zırhlı Push Döngüsü (Ağ kopmalarına ve çakışmalara karşı)
            for i in 1 2 3; do
              git push origin main && break
              echo "Push failed, trying to rebase..."
              git pull origin main --rebase || true
              sleep 15
            done
          fi
