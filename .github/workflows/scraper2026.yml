name: Goodreads Zombi Bot 2026

on:
  schedule:
    # Her gün gece 03:00'da tetiklenir (Fakat rastgele uyku ile uyanacak)
    - cron: '0 3 * * *'
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Rastgele Uyanma (İnsan Taklidi)
        run: |
          # 0 ile 120 dakika (7200 saniye) arası rastgele bir mola
          sleep_time=30   # $((RANDOM % 7200))
          echo "Bot uyandırıldı fakat dikkat çekmemek için $sleep_time saniye (yaklaşık $((sleep_time / 60)) dakika) yatakta keyif yapıyor..."
          sleep $sleep_time
          echo "Bot yataktan kalktı ve işe koyuldu!"

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Zombi Botu Çalıştır (Mesai)
        run: npm run start2026

      - name: Çekilen Verileri ve Varsa Hata Loglarını GitHub'a Kaydet
        run: |
          git config --global user.name "ZombiBot2026"
          git config --global user.email "zombibot2026@testdeposu.com"
          git add -A
          git commit -m "Zombi Bot 2026 Günlük Mesaisini Tamamladı" || echo "Değişiklik yok"
          git pull --rebase
          git push
